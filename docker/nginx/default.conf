# Equivalent of public_html/.htaccess_example for nginx + php-fpm.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /var/www/app/public_html;
    index index.php;

    server_tokens off;
    # Keep in sync with post_max_size in docker/php/app.ini.
    client_max_body_size 40M;

    # Re-resolve the app container on restart instead of caching its first IP.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    # Hidden files such as .htaccess.
    location ~ /\. {
        deny all;
    }

    # Uploaded files are served through the application (access control).
    location ^~ /files {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller is executed; any other .php URL goes through it.
    location ~ \.php$ {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass $php_upstream;
        # Keep in sync with max_execution_time in docker/php/app.ini.
        fastcgi_read_timeout 90s;
    }
}
