<VirtualHost *:80>
    DocumentRoot /var/www/app/public_html

    # Use public_html/.htaccess when it exists, otherwise the committed .htaccess_example.
    # Both are denied to clients by the default "^\.ht" rule in apache2.conf.
    AccessFileName .htaccess .htaccess_example

    <Directory /var/www/app/public_html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
