# Local development. Copy it once:
#   cp compose.override.example.yml compose.override.yml
# docker compose merges compose.override.yml into compose.yml automatically.
#
# MySQL credentials come from .env (docker compose reads it for ${...} values).
# Docker compose does not read .env.local: if you change DB_* there, MySQL will not see it.
services:
  php:
    build:
      target: app-dev
    volumes:
      - .:/var/www/app
    environment:
      # Created on the first start, when the database is empty.
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_NAME: Administrator
      ADMIN_PASSWORD: admin
    depends_on:
      mysql:
        condition: service_healthy

  web:
    environment:
      # Generates a self-signed certificate in docker/nginx/certs when none exists.
      # For a trusted one, see "HTTPS certificate" in README.md.
      SSL_SELF_SIGNED: "true"
    volumes:
      - ./public_html:/var/www/app/public_html:ro

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    # 3307 on the host to avoid clashing with a MySQL installed on the machine.
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
    ports:
      - "${PMA_PORT:-8090}:80"
    depends_on:
      - mysql

volumes:
  mysql-data:
