# Production:
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# Requires next to this file:
#   .env.prod.local                              at least HASH_SALT and DB_* values
#   docker/nginx/certs/cert.pem and key.pem      TLS certificate (full chain) and private key
# MySQL runs on the host machine: use DB_SERVER=host.docker.internal.

x-app-runtime: &app_runtime
  build:
    context: .
    target: app-prod
  restart: unless-stopped
  environment:
    APP_ENV: prod
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Fails instead of silently creating an empty directory when the file is missing.
    - type: bind
      source: ./.env.prod.local
      target: /var/www/app/.env.prod.local
      read_only: true
      bind:
        create_host_path: false
    - uploads:/var/www/app/public_html/files/uploaded

services:
  php:
    <<: *app_runtime

  scheduler:
    <<: *app_runtime
    command:
      - sh
      - -lc
      - while true; do php bin/console.php schedule:run; sleep 60; done
    depends_on:
      - php
  web:
    restart: unless-stopped
    volumes:
      # Read-only: a missing certificate stops nginx instead of generating a self-signed one.
      - ./docker/nginx/certs:/etc/nginx/certs:ro

volumes:
  uploads:
